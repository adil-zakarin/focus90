<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Фокус 90</title>
  <meta name="description" content="Один фокус на 90 дней: выгрузи голову, разложи, выбери, доведи до конца.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EEF0F5" id="themeColor">
  <script>
    // Тема ставится до отрисовки, чтобы не мигал светлый экран.
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('focus90:theme') || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('themeColor').content = dark ? '#06070D' : '#EEF0F5';
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Фокус 90">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="aurora" id="aurora" data-mood="calm"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="topbar" aria-hidden="true"></div>
  <button class="timer-pill" id="timerPill" data-act="open-timer" hidden>00:00</button>

  <main id="view" class="wrap view"></main>

  <nav class="dock-wrap" aria-label="Разделы">
    <div class="dock" id="dock">
      <span class="lens" aria-hidden="true"><i></i></span>
      <button class="tab" data-act="tab" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/></svg>
        Сегодня
      </button>
      <button class="tab" data-act="tab" data-tab="sort">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5h4.2l1.6 2.5h5.4l1.6-2.5h4.2"/><path d="M6 5h12l2.5 8.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18v-4.5z"/></svg>
        Разбор
        <span class="badge" id="inboxBadge" hidden>0</span>
      </button>
      <button class="tab" data-act="tab" data-tab="focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        Фокус
      </button>
      <button class="tab" data-act="tab" data-tab="lists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></svg>
        Списки
      </button>
    </div>
    <button class="fab" data-act="capture" aria-label="Записать мысль">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="Окно">
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
